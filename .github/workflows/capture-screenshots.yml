name: Capture ProofStack screenshots # final framing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PROOFSTACK_PROVIDER: mock
      PROOFSTACK_STORAGE: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Launch ProofStack
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/proofstack-streamlit.log 2>&1 &
          echo $! > /tmp/proofstack.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/proofstack-streamlit.log
          exit 1

      - name: Capture screenshots
        run: python scripts/capture_screenshots.py

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: proofstack-ui-screenshots
          path: |
            docs/images/proofstack-reviewer-workflow.png
            docs/images/proofstack-advisory-grounding.png

      - name: Stop ProofStack
        if: always()
        run: |
          if [ -f /tmp/proofstack.pid ]; then
            kill "$(cat /tmp/proofstack.pid)" || true
          fi

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/proofstack-reviewer-workflow.png docs/images/proofstack-advisory-grounding.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Add final ProofStack UI screenshots"
          git push
